    h1 { display: none; }
    button[onclick="volver()"] { display: none; }
  </style>
</head>

  protegerVista("USER");
</script>

  </div>

</div>



<!-- Modal flotante -->

    <h3 id="detalleTitulo"></h3>
    <p id="detalleDescripcion"></p>
    <p id="detallePrecio"></p>

</div>
